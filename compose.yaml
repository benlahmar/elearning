services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elearning}
      POSTGRES_USER: ${POSTGRES_USER:-elearning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copiez .env.example vers .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 10
  api:
    build:
      context: ./backend
      args:
        INSTALL_SEMANTIC: ${INSTALL_SEMANTIC:-true}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-elearning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-elearning}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Définir ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9010}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Définir S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Définir S3_SECRET_KEY}
      S3_BUCKET: learning-private
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-e8f8c211226b894fcb81acc59f3b34ba3efd5f42}
      NO_PROXY: minio,db,localhost,127.0.0.1,${NO_PROXY:-}
      no_proxy: minio,db,localhost,127.0.0.1,${NO_PROXY:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - model_cache:/app/model-cache
    depends_on:
      db:
        condition: service_healthy
  minio:
    build: ./infra/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Définir S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Définir S3_SECRET_KEY}
    ports:
      - '127.0.0.1:9010:9000'
    volumes:
      - minio_data:/data
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8013}:80'
    depends_on:
      - api
volumes:
  postgres_data:
  minio_data:
  model_cache:
